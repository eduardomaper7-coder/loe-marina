<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2a1c17">
    <title>Canjear bono | Loe Marina</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/css/styles.css?v=20261107-canje-1">
    <style>
        body.canje { margin: 0; min-height: 100svh; background: var(--sand); color: var(--ink); font-family: var(--sans); }
        .canje-top { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--cocoa); color: var(--white); }
        .canje-top img { width: 40px; height: 40px; }
        .canje-top strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 1.3rem; line-height: 1; }
        .canje-top span { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--copper-300); }
        .canje-wrap { max-width: 520px; margin: 0 auto; padding: 22px 16px 40px; }
        .canje-card { background: var(--cream); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); overflow: hidden; }
        .canje-card + .canje-card { margin-top: 14px; }
        .canje-pad { padding: 22px; }
        .canje-card h1 { margin: 0 0 6px; font-family: var(--serif); font-weight: 500; font-size: 1.9rem; line-height: 1.1; }
        .canje-card p { margin: 0 0 12px; color: var(--ink-soft); line-height: 1.5; }
        .canje-status { padding: 18px 22px; color: #fff; }
        .canje-status b { display: block; font-size: 1.5rem; letter-spacing: .04em; }
        .canje-status small { display: block; margin-top: 2px; font-size: .95rem; opacity: .92; }
        .st-valido { background: #2f6b4a; }
        .st-canjeado { background: #b26a1f; }
        .st-reembolsado, .st-no_pagado, .st-invalido { background: var(--danger); }
        .canje-dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 0; }
        .canje-dl dt { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--copper-700); padding-top: 3px; }
        .canje-dl dd { margin: 0; font-size: 1rem; color: var(--ink); word-break: break-word; }
        .canje-treat { font-family: var(--serif); font-size: 1.55rem; line-height: 1.15; margin: 0 0 2px; }
        .canje-opt { font-family: var(--serif); font-style: italic; color: var(--copper-700); font-size: 1.1rem; margin: 0 0 16px; }
        .canje-btn { display: block; width: 100%; padding: 16px; border: 0; border-radius: 999px; font: 500 .95rem var(--sans); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
        .canje-btn.primary { background: var(--copper-700); color: #fff; }
        .canje-btn.ghost { background: transparent; color: var(--copper-700); border: 1px solid var(--line-strong); }
        .canje-btn:disabled { opacity: .55; cursor: wait; }
        .canje-actions { display: grid; gap: 10px; margin-top: 20px; }
        .canje-input { width: 100%; box-sizing: border-box; padding: 15px 16px; border: 1px solid var(--line-strong); border-radius: 12px; background: #fff; font: 1.15rem var(--sans); letter-spacing: .08em; }
        .canje-err { color: var(--danger); font-size: .95rem; margin: 10px 0 0; }
        .canje-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; font-size: .9rem; }
        .canje-links a, .canje-links button { color: var(--copper-700); background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; cursor: pointer; }
        .canje-note { font-size: .9rem; color: var(--ink-soft); }
    </style>
</head>
<body class="canje">
    <header class="canje-top"><img src="/assets/img/brand/monogram-sm.webp" alt=""><div><strong>Loe Marina</strong><span>Canje de bonos · Personal</span></div></header>
    <main class="canje-wrap" id="app" aria-live="polite"><div class="canje-card canje-pad"><p>Cargando…</p></div></main>

    <script>
    (function () {
        var app = document.getElementById('app');
        var token = new URLSearchParams(location.search).get('b') || '';
        var KEY = 'loe-staff-pin';
        var store = {
            get: function () { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } },
            set: function (v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
            del: function () { try { localStorage.removeItem(KEY); } catch (e) {} }
        };
        var pin = store.get();

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

        function api(method, body) {
            return fetch('/api/bono?b=' + encodeURIComponent(token), {
                method: method,
                headers: Object.assign({ 'X-Staff-Pin': pin }, body ? { 'Content-Type': 'application/json' } : {}),
                body: body ? JSON.stringify(body) : undefined
            }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; }); });
        }

        function showPin(error) {
            app.innerHTML =
                '<div class="canje-card canje-pad">' +
                '<h1>Acceso del personal</h1>' +
                '<p>Introduce el PIN del centro para ver y canjear este bono. Solo se pide una vez en este móvil.</p>' +
                '<form id="pin-form"><input class="canje-input" id="pin" type="password" inputmode="text" autocomplete="current-password" placeholder="PIN" required>' +
                (error ? '<p class="canje-err">' + esc(error) + '</p>' : '') +
                '<div class="canje-actions"><button class="canje-btn primary" type="submit">Entrar</button></div></form>' +
                '</div>' +
                '<div class="canje-card canje-pad"><p class="canje-note"><strong>¿Eres cliente?</strong> Este código lo escanea el personal de Loe Marina el día de tu cita. Para pedir cita, llama al <a href="tel:+34922236677">922 236 677</a>.</p></div>';
            var input = document.getElementById('pin');
            input.focus();
            document.getElementById('pin-form').addEventListener('submit', function (e) {
                e.preventDefault();
                pin = input.value.trim();
                load(true);
            });
        }

        var LABEL = {
            valido: ['VÁLIDO', 'Se puede canjear'],
            canjeado: ['YA CANJEADO', ''],
            reembolsado: ['NO VÁLIDO', 'El pago de este bono se ha reembolsado'],
            no_pagado: ['NO VÁLIDO', 'El pago no está confirmado'],
            invalido: ['NO VÁLIDO', 'Este QR no corresponde a ningún bono']
        };

        function render(d) {
            var l = LABEL[d.estado] || LABEL.invalido;
            var sub = d.estado === 'canjeado' ? 'El ' + esc(d.canjeadoEl) : esc(l[1]);
            var rows = [
                ['Código', d.codigo],
                ['Bono', d.numero + ' de ' + d.total + ' del pedido'],
                ['Titular', d.titular],
                d.para ? ['Para', d.para] : null,
                ['Compra', d.compra],
                d.email ? ['Email', d.email] : null,
                d.telefono ? ['Teléfono', d.telefono] : null
            ].filter(Boolean).map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1] || '—') + '</dd>'; }).join('');
            var actions = '';
            if (d.estado === 'valido') actions = '<button class="canje-btn primary" id="do-canjear" type="button">Marcar como canjeado</button>';
            if (d.estado === 'canjeado') actions = '<button class="canje-btn ghost" id="do-deshacer" type="button">Deshacer canje</button>';
            app.innerHTML =
                '<div class="canje-card">' +
                '<div class="canje-status st-' + esc(d.estado) + '"><b>' + l[0] + '</b><small>' + sub + '</small></div>' +
                '<div class="canje-pad">' +
                '<p class="canje-treat">' + esc(d.tratamiento) + '</p>' +
                (d.opcion ? '<p class="canje-opt">' + esc(d.opcion) + '</p>' : '<p class="canje-opt"></p>') +
                (d.reembolsoParcial ? '<p class="canje-err">Atención: este pedido tiene un reembolso parcial. Revisa el pago en Stripe.</p>' : '') +
                '<dl class="canje-dl">' + rows + '</dl>' +
                (d.error ? '<p class="canje-err">' + esc(d.error) + '</p>' : '') +
                (actions ? '<div class="canje-actions">' + actions + '</div>' : '') +
                '<div class="canje-links"><a href="' + esc(d.stripeUrl) + '" target="_blank" rel="noopener">Ver pago en Stripe</a><button type="button" id="logout">Cerrar sesión</button></div>' +
                '</div></div>';
            bind('do-canjear', 'canjear', '¿Confirmas que el cliente ha usado este bono?\n\n' + d.tratamiento + (d.opcion ? ' · ' + d.opcion : '') + '\nCódigo ' + d.codigo);
            bind('do-deshacer', 'deshacer', '¿Quieres volver a dejar este bono como NO canjeado?');
            document.getElementById('logout').addEventListener('click', function () { store.del(); pin = ''; showPin(); });
        }

        function bind(id, accion, question) {
            var b = document.getElementById(id);
            if (!b) return;
            b.addEventListener('click', function () {
                if (!window.confirm(question)) return;
                b.disabled = true; b.textContent = 'Guardando…';
                api('POST', { accion: accion }).then(handle, fail);
            });
        }

        function handle(d) {
            if (d._status === 401) { store.del(); return showPin(pin ? 'PIN incorrecto. Inténtalo de nuevo.' : ''); }
            if (d.estado === 'invalido') {
                app.innerHTML = '<div class="canje-card"><div class="canje-status st-invalido"><b>NO VÁLIDO</b><small>' + esc(d.error || 'Este QR no corresponde a ningún bono') + '</small></div><div class="canje-pad"><p>Comprueba que estás escaneando un bono de Loe Marina. Si el cliente insiste, busca su pago en Stripe por su email.</p></div></div>';
                return;
            }
            if (d._status === 200 || d._status === 409) { store.set(pin); return render(d); }
            fail(d.error);
        }
        function fail(msg) {
            app.innerHTML = '<div class="canje-card canje-pad"><h1>No se ha podido cargar</h1><p>' + esc(typeof msg === 'string' ? msg : 'Revisa la conexión e inténtalo de nuevo.') + '</p><div class="canje-actions"><button class="canje-btn primary" type="button" onclick="location.reload()">Reintentar</button></div></div>';
        }
        function load() {
            app.innerHTML = '<div class="canje-card canje-pad"><p>Comprobando el bono…</p></div>';
            api('GET').then(handle, fail);
        }

        if (!token) {
            app.innerHTML = '<div class="canje-card canje-pad"><h1>Escanea un bono</h1><p>Abre la cámara del móvil y escanea el código QR del bono del cliente.</p></div>';
        } else if (!pin) {
            showPin();
        } else {
            load();
        }
    })();
    </script>
</body>
</html>
